[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"

[project]
name = "typesafe-jev-mcp"
version = "0.2.0"
description = "Model Context Protocol (MCP) server powered by TypeSafe Jev (System One) for fast calibrated agent decisions and optimal model routing across Claude Code, Codex, Gemini CLI, and Antigravity."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "TypeSafe Jev MCP Contributors" }]
keywords = ["mcp", "typesafe", "jev", "model-routing", "system-one", "agent-routing"]
dependencies = [
    "mcp>=1.6.0",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "tomli-w>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
typesafe-jev-mcp = "typesafe_jev_mcp.routes.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/typesafe_jev_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-p no:cacheprovider"
